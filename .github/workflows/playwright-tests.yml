name: AIT Playwright Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --unsafe-perm=true --allow-root

      - name: Install Playwright and Browsers
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Run Playwright tests
        run: |
          CI=true ./node_modules/.bin/playwright test --reporter=html || echo "Tests failed, review logs."

          if [ -d playwright-report ]; then
            echo "artifact_exists=true" >> $GITHUB_ENV
          else
            echo "artifact_exists=false" >> $GITHUB_ENV
          fi

      - name: Upload HTML Report
        if: env.artifact_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AIT-Playwright-HTML-Report
          path: playwright-report/

      - name: Upload Test Artifacts
        if: env.artifact_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Trace-Artifacts
          path: playwright-report/*
